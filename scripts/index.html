<!doctype html>
<html>
<body>
  <video id="v" autoplay muted playsinline controls width="640"
         src="http://127.0.0.1:8090"></video>

  <script>
    const v = document.getElementById("v");

    function jumpToLive() {
      if (v.buffered.length === 0) return;
      const live = v.buffered.end(v.buffered.length - 1);
      v.currentTime = Math.max(0, live - 0.2);
      v.playbackRate = 1.0;
    }

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        jumpToLive();
        v.play().catch(() => {});
      }
    });

    setInterval(() => {
      if (document.hidden) return;
      if (v.buffered.length === 0) return;

      const live = v.buffered.end(v.buffered.length - 1);
      const delay = live - v.currentTime;

      console.log("delay", delay.toFixed(2));

      if (delay > 1.0) {
        v.currentTime = live - 0.2;
        v.playbackRate = 1.0;
      } else if (delay > 0.5) {
        v.playbackRate = 1.25;
      } else {
        v.playbackRate = 1.0;
      }
    }, 500);
  </script>
</body>
</html>
